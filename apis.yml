name: Wildlife Studios
description: 'Wildlife Studios is one of the world''s largest mobile game developers and
  publishers, founded in Brazil in 2011. It builds and operates free-to-play games played
  globally, with more than 4.7 billion downloads across a portfolio of over 60 titles including
  Zooba, Sniper 3D, Tennis Clash, War Machines, and Sky Warriors, and runs a publishing division
  for third-party studios. Wildlife is a consumer gaming company: its public surface is
  player-facing games and corporate/careers content, not a developer platform. As of this
  enrichment pass it publishes no public developer portal, API documentation, OpenAPI/AsyncAPI
  specification, SDKs, or MCP server. Surfaced as a portfolio company of bessemer-venture-partners
  and tracked in the API Evangelist network.'
